spring.application.name=signbridge-backend

# Lắng nghe mọi địa chỉ để điện thoại cùng wifi gọi được
server.address=0.0.0.0
server.port=8080

# Spring mặc định giới hạn 1MB/file — nâng cho audio (2MB) và 16 frame x 250KB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=6MB

# mock = trả JSON mẫu; real = gọi AI thật (chưa có, TV4 + TV3 làm sau)
ai.mode=${AI_MODE:mock}

# confidence >= ngưỡng thì mobile phát loa luôn
sign.confidence-threshold=0.7

# Service STT của TV3 (repo SignBridge-AI, FastAPI cổng 8000) — dùng cho RealAiGateway
ai.stt.base-url=${AI_STT_BASE_URL:http://localhost:8000}
